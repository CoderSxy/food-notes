map "$request_method:$http_origin" $food_notes_bad_origin {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):https://food\.nerosun\.cn$ 0;
    ~^(POST|PUT|PATCH|DELETE):.+ 1;
}
server {
    listen 80;
    listen [::]:80;
    server_name food.nerosun.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/food-notes;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://food.nerosun.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name food.nerosun.cn;
    ssl_certificate /etc/letsencrypt/live/food.nerosun.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/food.nerosun.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/food-notes.access.log;
    error_log /var/log/nginx/food-notes.error.log;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    include /etc/nginx/snippets/food-notes-mode.conf;
}
