server {
    listen 80;
    listen [::]:80;
    server_name food.nerosun.cn;
    access_log /var/log/nginx/food-notes.access.log;
    error_log /var/log/nginx/food-notes.error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/food-notes;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        add_header Retry-After 3600 always;
        return 503 "Food Notes: deployment pending.\n";
    }
}
